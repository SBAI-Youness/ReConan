<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ReConan</title>
    <meta name="description" content="The page you are looking for could not be found.">
    <link rel="icon" type="image/png" href="assets/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --c-bg: #080808;
            --c-surface: #0f0f0f;
            --c-card: #141414;
            --c-border: rgba(255, 255, 255, 0.07);
            --c-accent: #b22222;
            --c-accent-h: #cc2929;
            --c-text: #f0f0f0;
            --c-muted: #707070;
            --c-dim: #303030;
            --nav-h: 68px;
            --max-w: 1160px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--c-bg);
            color: var(--c-text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 404 Content */
        .page-404 {
            text-align: center;
            max-width: 560px;
            padding: 48px 32px;
        }

        .content__icon {
            height: 120px;
            margin: 0 auto 36px;
            filter: drop-shadow(0 8px 24px rgba(178, 34, 34, 0.3));
            opacity: 0.6;
        }

        .error-code {
            font-size: 7rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1px rgba(178, 34, 34, 0.4);
            margin-bottom: 24px;
            user-select: none;
        }

        .content h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .content p {
            font-size: 1rem;
            color: var(--c-muted);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 6px;
            padding: 11px 22px;
            transition: all 0.2s;
            cursor: pointer;
            font-family: inherit;
        }

        .btn--primary {
            background: var(--c-accent);
            color: #fff;
            border: 1px solid transparent;
        }

        .btn--primary:hover {
            background: var(--c-accent-h);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(178, 34, 34, 0.35);
        }

        .btn--outline {
            background: transparent;
            color: var(--c-text);
            border: 1px solid var(--c-border);
        }

        .btn--outline:hover {
            background: var(--c-card);
            border-color: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 768px) {
            .page-404 {
                padding: 48px 20px;
            }

            .error-code {
                font-size: 5rem;
            }

            .content h1 {
                font-size: 1.4rem;
            }
            .content__icon {
                height: 80px;
                margin-bottom: 24px;
            }
        }
    </style>
</head>

<body>



    <main class="page-404">
        <img src="assets/icon.png" alt="ReConan" class="content__icon">
        <div class="error-code">404</div>
        <h1>Nothing to investigate here</h1>
        <p>The page you're looking for doesn't exist or may have been moved. Even the best detectives hit dead ends -
            let's get you back on track.</p>
        <div class="actions">
            <a href="index.html" class="btn btn--primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 5l-7 7 7 7" />
                </svg>
                Back to Home
            </a>
            <a href="https://github.com/SBAI-Youness/ReConan" class="btn btn--outline" target="_blank"
                rel="noopener">View on GitHub</a>
    </main>


</body>

</html>
